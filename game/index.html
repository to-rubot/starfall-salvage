<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFALL SALVAGE</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #04060f; }
  #game {
    position: fixed; inset: 0; margin: auto;
    width: min(100vw, 177.78vh); height: min(56.25vw, 100vh);
    display: block; touch-action: none; cursor: crosshair;
    background: #070b1d;
  }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="STARFALL SALVAGE: pilot a salvage ship with WASD or arrow keys, aim and fire with the mouse, dash with Shift, clear eight waves and defeat the Dreadnought"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
